<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>口袋打印机 · 纯静态版</title>
<link rel="stylesheet" href="vendor/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">MB</span>
    <div>
      <h1>口袋打印机控制台</h1>
      <p class="sub">实现 1｜纯静态网页（零后端）</p>
    </div>
  </div>
  <button id="btn-connect" class="primary">连接打印机</button>
</header>

<div id="conn" class="conn">未连接</div>

<main>
  <section class="card">
    <div class="tabs">
      <button class="tab active" data-tab="text">文字</button>
      <button class="tab" data-tab="image">图片</button>
      <button class="tab" data-tab="debug">调试</button>
    </div>

    <div class="pane active" id="pane-text">
      <textarea id="text" rows="6" placeholder="要打印的文字">咕咕机测试
第二行 hello 123</textarea>
      <div class="row">
        <label>字号 <input id="font-size" type="range" min="14" max="48" value="26"><span id="font-size-val">26</span></label>
      </div>
      <p class="hint">文字默认走 GBK 文本帧（1 帧、几十字节，最快）；调字号或浓度会自动转位图
        —— GBK 帧由打印机固件自己画字，改不了字号深浅。</p>
      <div class="row">
        <label class="chk"><input id="bold" type="checkbox"> 加粗</label>
        <label class="chk"><input id="underline" type="checkbox"> 下划线</label>
        <label class="chk"><input id="feed" type="checkbox" checked> 打后走纸</label>
      </div>
      <div class="row">
        <label>方式
          <select id="fmt-text">
            <option value="gbk">GBK 文本帧（最快）</option>
            <option value="bmp">位图（可调字号/浓度）</option>
          </select>
        </label>
        <label>二值化
          <select id="mode-text">
            <option value="threshold">阈值（文字最清晰）</option>
            <option value="floyd">Floyd 抖动</option>
            <option value="atkinson">Atkinson</option>
            <option value="bayer">Bayer 网点</option>
          </select>
        </label>
        <label>浓度
          <select id="darken-text">
            <option value="0">标准</option>
            <option value="1">加深</option>
            <option value="2">更黑</option>
            <option value="3">最黑</option>
          </select>
        </label>
        <label class="chk"><input id="invert-text" type="checkbox"> 反色</label>
      </div>
      <div class="actions">
        <button id="btn-preview-text" class="ghost">预览</button>
        <button id="btn-print-text" class="primary">打印</button>
      </div>
    </div>

    <div class="pane" id="pane-image">
      <input id="file" type="file" accept="image/*">
      <div class="row">
        <label>二值化
          <select id="mode-image">
            <option value="floyd">Floyd 抖动（照片）</option>
            <option value="atkinson">Atkinson（对比高）</option>
            <option value="bayer">Bayer 网点</option>
            <option value="threshold">阈值（线稿）</option>
          </select>
        </label>
        <label>浓度
          <select id="darken-image">
            <option value="0">标准</option>
            <option value="1">加深</option>
            <option value="2">更黑</option>
            <option value="3">最黑</option>
          </select>
        </label>
        <label class="chk"><input id="invert-image" type="checkbox"> 反色</label>
        <label class="chk"><input id="vflip" type="checkbox"> 垂直翻转</label>
      </div>
      <div class="actions">
        <button id="btn-preview-image" class="ghost">预览</button>
        <button id="btn-print-image" class="primary">打印</button>
      </div>
    </div>

    <div class="pane" id="pane-debug">
      <p class="hint">对不上/不清晰时先打校准图；型号不符时点「探测 GATT」把表发出来。</p>
      <div class="row">
        <label>写入分片
          <select id="chunk">
            <option value="20">20 B（最稳）</option>
            <option value="64">64 B</option>
            <option value="128">128 B</option>
            <option value="182">182 B</option>
          </select>
        </label>
        <label class="chk"><input id="preheat" type="checkbox" checked> 预热包</label>
      </div>
      <div class="row">
        <label>走纸 <input id="feed-mm" type="number" value="20" min="1" max="500" step="1"> mm</label>
        <label>纸总长 <input id="total-mm" type="number" min="20" max="500" step="1" placeholder="留空=不限"> mm</label>
        <label>浓度
          <select id="density">
            <option value="0">默认(10)</option>
            <option value="3">3（最浅/最慢）</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6" selected>6（推荐长图）</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="10">10（最深/最快）</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button id="btn-feed" class="ghost">走纸</button>
        <button id="btn-calib" class="primary">打印校准图</button>
        <button id="btn-sizeprobe" class="ghost">字号档位测试</button>
        <button id="btn-led-on" class="ghost">开灯</button>
        <button id="btn-led-off" class="ghost">关灯</button>
        <button id="btn-device" class="ghost">读设备信息</button>
        <button id="btn-gatt" class="ghost">探测 GATT</button>
        <button id="btn-status" class="ghost">查询状态</button>
      </div>
      <pre id="dev-out" class="log small"></pre>
      <pre id="gatt-out" class="log small"></pre>
    </div>
  </section>

  <section class="card">
    <div class="preview-head"><h2>预览</h2><span id="meta" class="meta"></span></div>
    <div class="preview-wrap"><img id="preview" alt="预览"></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="actions">
      <button id="btn-clear" class="ghost">清空日志</button>
      <button id="btn-copy" class="ghost">复制日志</button>
    </div>
    <pre id="log" class="log"></pre>
  </section>
</main>

<footer>
  <span id="mode">浏览器本地编码</span>
  <span id="health"></span>
</footer>

<script src="vendor/ble-util.js"></script>
<script src="vendor/ble-link.js"></script>
<script src="vendor/ui.js"></script>
<script src="vendor/encoder.js"></script>
<script src="vendor/render.js"></script>
<script src="vendor/gbk.js"></script>
<script src="app.js"></script>
</body>
</html>
